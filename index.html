<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KiCad Component Finder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <span class="eyebrow">KiCad assistant</span>
        <strong>Component Finder</strong>
      </div>
      <span id="api-status" class="api-status">Checking services</span>
    </header>
    <main>
      <form id="component-form" class="search-panel">
        <label for="supplier">Source parts from</label>
        <select id="supplier">
          <option value="lcsc">JLCPCB / LCSC — assembly catalog</option>
          <option value="digikey">DigiKey</option>
        </select>
        <p class="hint" id="supplier-note">Checks JLCPCB catalog stock. Prices exclude assembly fees. No sourcing API key needed.</p>
        <label><input id="prefer-basic" type="checkbox" checked /> Prefer Basic parts for JLCPCB assembly</label>
        <label for="component-query">Describe the component you need</label>
        <p class="hint">Include the job it must do and any limits that matter.</p>
        <div class="search-row">
          <input id="component-query" autocomplete="off" placeholder="5 V, 3 A buck regulator with a 12 V input" />
          <button id="component-search" class="button primary" type="submit">Find parts</button>
        </div>
      </form>
      <div id="message" class="message hidden" role="status" aria-live="polite"></div>
      <section id="interpreted-request" class="request-summary hidden"></section>
      <section id="component-results" class="hidden">
        <div class="section-heading"><h2>Suggested parts</h2><span id="result-count"></span></div>
        <div id="component-cards" class="component-list"></div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
