<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KiCad Design Assistant</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="app-header"><div><span class="eyebrow">KiCad</span><strong>Design Assistant</strong></div><button id="new-conversation" type="button" class="quiet-button">+ New chat</button></header>
<main><div class="workspace-toolbar"><label for="mode" class="sr-only">Workflow</label><select id="mode"><option value="ask">Chat</option><option value="search">Find parts</option></select><span id="api-status" class="api-status">Checking connection</span></div>
<div class="conversation-workspace"><section id="welcome"><h2>What are you designing?</h2><p>Find a part, compare options, or work through a circuit question.</p><button type="button" class="suggestion" data-prompt="Find an easy-to-solder MCU with Wi-Fi and Bluetooth.">Find a wireless MCU</button><button type="button" class="suggestion" data-prompt="How do I choose between SPI and MIPI DSI for a display? Don't search for parts yet.">Compare display interfaces</button></section><div id="conversation" aria-live="polite"></div><section id="interpreted-request" class="request-summary hidden"></section><section id="component-results" class="hidden"><div class="section-heading"><h2>Parts to review</h2><span id="result-count"></span></div><div id="component-cards" class="component-list"></div></section></div>
<form id="component-form" class="search-panel composer"><details class="preferences"><summary>Connection &amp; sourcing</summary><div id="ask-controls"><label for="ask-provider">AI connection</label><select id="ask-provider"><option value="codex">Codex account — Codex allowance</option><option value="api">OpenAI API — separate API billing</option></select></div><label for="supplier">Supplier</label><select id="supplier"><option value="lcsc">JLCPCB / LCSC</option><option value="digikey">DigiKey</option></select><p class="hint" id="supplier-note"></p><a href="/snapmagic" target="_blank" rel="noopener">Connect SnapMagic for DigiKey CAD</a><label class="check-label"><input id="prefer-basic" type="checkbox" checked> Prefer JLCPCB Basic parts</label></details>
<label for="component-query" class="sr-only">Message</label><textarea id="component-query" rows="3" placeholder="Ask about your circuit or describe a part…"></textarea><div class="composer-controls"><label for="ask-model" class="sr-only">Model</label><select id="ask-model"><option value="latest">Latest available</option></select><label for="ask-effort" class="sr-only">Reasoning level</label><select id="ask-effort" title="Higher reasoning can take longer and use more allowance"><option value="auto">Auto reasoning</option></select><button id="component-search" class="button primary" type="submit">Send</button></div><div id="message" class="message" role="status">Enter to send · Shift+Enter for a new line</div></form>
</main><script type="module" src="app.js"></script></body></html>
